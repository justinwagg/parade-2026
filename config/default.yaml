system:
  name: parade-float-2026
  environment: development
hardware:
  dmx_driver: artnet
  gpio_driver: rpi
  pixel_driver: rpi
  relay_driver: rpi
  gpio_chip: 0
network:
  artnet_nodes:
  - id: main_node
    ip: 2.0.0.1
    port: 6454
dmx:
  universes:
  - id: 1
    node: main_node
    protocol: artnet
    refresh_hz: 40
    on_node_loss: hold
