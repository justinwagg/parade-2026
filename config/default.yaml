gpio_inputs:
- id: rotation_index
  pin: 17
  pull: up
  active_low: false
  debounce_ms: 20
  description: Turntable index microswitch (NC to GND; actuated or cut wire reads HIGH = active)
- id: performer_button
  pin: 27
  pull: up
  active_low: true
  debounce_ms: 50
  description: Momentary button pressed by performer when in position inside booth
- id: estop_monitor
  pin: 22
  pull: up
  active_low: false
  debounce_ms: 20
  description: E-stop monitor contact (NC to GND; pressed or cut wire reads HIGH = active)
relay_outputs:
- id: phone_booth_rotation
  pin: 18
  active_low: false
  description: Controls phone booth rotation motor (relay open = motor stops)
pixel_strips:
- id: main_strip
  pin: 10
  count: 50
  strip_type: WS2812B
  brightness: 1.0
  description: Main NeoPixel strip on phone booth
safety:
  # estop_pin: estop_monitor
  estop_pin: null
  armed_requires_operator: true
web:
  host: 0.0.0.0
  port: 8080
  log_level: info
fixture_groups:
- id: booth_bottom
  name: Bottom of Booth
  fixture_ids:
  - booth_bottom_1
  - booth_bottom_2
  - booth_bottom_3
  - booth_bottom_4
  description: ''
- id: booth_top
  name: Top of Booth
