- id: run_core_animation
  name: Run Core Animation
  description: Runs Core Animation once performer is ready and hits button
  trigger:
    event: gpio_changed
    condition: event.active == true and event.pin_id == 'rotation_index' and vars.get('performer_is_ready',
      False)
  actions:
  - type: set_dmx_scene
    scene: cold_spark_high
  - type: set_dmx_scene
    scene: fog_full
  - type: parallel
    actions:
    - type: group_flash
      colors:
      - - 255
        - 251
        - 0
      - - 255
        - 255
        - 255
      - - 255
        - 251
        - 0
      - - 255
        - 255
        - 255
      count: 15
      on_ms: 1000
      off_ms: 1000
      group: booth_bottom
    - type: group_flash
      colors:
      - - 0
        - 97
        - 255
      - - 0
        - 249
        - 0
      - - 4
        - 51
        - 255
      - - 0
        - 249
        - 0
      count: 15
      on_ms: 1000
      off_ms: 1000
      group: booth_top
    - type: group_flash
      colors:
      - - 123
        - 33
        - 159
      - - 0
        - 0
        - 0
      - - 148
        - 33
        - 146
      - - 0
        - 0
        - 0
      count: 15
      on_ms: 1000
      off_ms: 1000
      group: outside
  - type: set_dmx_scene
    scene: fog_off
  - type: set_dmx_scene
    scene: cold_spark_off
  - type: set_var
    name: performer_is_ready
    value: false
  priority: 10
  cooldown_ms: 1000.0
