[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parade"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
parade = "parade.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parade"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
]
